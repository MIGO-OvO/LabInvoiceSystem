name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            format: zip
          - os: windows-latest
            rid: win-arm64
            format: zip
          - os: ubuntu-latest
            rid: linux-x64
            format: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            format: tar.gz
          - os: macos-latest
            rid: osx-x64
            format: tar.gz
          - os: macos-latest
            rid: osx-arm64
            format: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content LabInvoiceSystem/LabInvoiceSystem.csproj
          $version = ($project.Project.PropertyGroup.Version | Select-Object -First 1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish LabInvoiceSystem/LabInvoiceSystem.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            --output "$env:RUNNER_TEMP/publish" `
            -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Package Windows build
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP/publish/*" `
            -DestinationPath "artifacts/LabInvoiceSystem-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Package Unix build
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p artifacts
          chmod +x "$RUNNER_TEMP/publish/LabInvoiceSystem"
          tar -C "$RUNNER_TEMP/publish" -czf \
            "artifacts/LabInvoiceSystem-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: LabInvoiceSystem-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag \
            --latest \
            --title "LabInvoiceSystem ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
